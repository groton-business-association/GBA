# Settings for the member editing page (/admin). Written as JSON, which the editor reads as YAML.
# The categories list here is the master list: build.py copies it to site/data/categories.csv.
{
  "backend": {
    "name": "github",
    "repo": "OWNER/REPO",
    "branch": "main"
  },
  "site_url": "https://groton-business-association.netlify.app",
  "display_url": "https://groton-business-association.netlify.app",
  "media_folder": "site/assets/logos",
  "public_folder": "assets/logos",
  "collections": [
    {
      "name": "members",
      "label": "Members",
      "label_singular": "Member",
      "description": "GBA member businesses and organizations. Each save updates the website within about a minute.",
      "folder": "members",
      "extension": "json",
      "format": "json",
      "create": true,
      "delete": true,
      "identifier_field": "name",
      "slug": "{{slug}}",
      "summary": "{{name}}",
      "sortable_fields": [
        "name"
      ],
      "fields": [
        {
          "label": "Business or member name",
          "name": "name",
          "widget": "string",
          "hint": "As it should appear on the website."
        },
        {
          "label": "Show on the website",
          "name": "active",
          "widget": "boolean",
          "default": true,
          "hint": "Turn off to hide this member, for example when dues are not paid. The record is kept."
        },
        {
          "label": "Contact person and title",
          "name": "contact",
          "widget": "string",
          "required": false,
          "hint": "For example: Jeff Gordon, Broker/Owner"
        },
        {
          "label": "Website",
          "name": "website",
          "widget": "string",
          "required": false,
          "hint": "Full address, starting with https://"
        },
        {
          "label": "Email",
          "name": "email",
          "widget": "string",
          "required": false,
          "hint": "Shown publicly."
        },
        {
          "label": "Phone",
          "name": "phone",
          "widget": "string",
          "required": false,
          "hint": "Shown publicly."
        },
        {
          "label": "Town",
          "name": "town",
          "widget": "string",
          "required": false,
          "hint": "For example: Groton, MA"
        },
        {
          "label": "Categories",
          "name": "categories",
          "widget": "select",
          "multiple": true,
          "required": false,
          "options": [
            "Accommodations & Hospitality",
            "Agriculture",
            "Arts & Culture",
            "Arts & Culture > Art & Sculpture Teaching & Education",
            "Banking & Mortgage Lending",
            "Business Services",
            "Business Services > Business Consulting",
            "Business Services > Business Insurance",
            "Business Services > Business Networking",
            "Business Services > Business Process Optimization",
            "Business Services > Change Management",
            "Business Services > Executive Coaching",
            "Business Services > Graphic Design",
            "Business Services > Leadership Development",
            "Business Services > Management Consulting",
            "Business Services > Moving & Storage",
            "Business Services > Signage & Printing Services",
            "Business Services > Team Building",
            "Business Services > Website Design & Development",
            "Catering",
            "Chamber of Commerce",
            "Community Center",
            "Contractors & Trades",
            "Contractors & Trades > General Contractor",
            "Contractors & Trades > Handyman Services",
            "Contractors & Trades > HVAC",
            "Contractors & Trades > Kitchen & Bath Installation",
            "Contractors & Trades > Plumber",
            "Contractors & Trades > Renovations",
            "Contractors & Trades > Tree Removal",
            "Creative Arts, Fabrication & Design",
            "Dining",
            "Restaurants & Eating Establishments",
            "Empowerment Strategies",
            "Financial Advisor",
            "Health Services",
            "Health Services > Accessibility",
            "Health Services > Accessibility > Stairlifts",
            "Health Services > Chiropractic Care",
            "Health Services > Deer, Tick and Mosquito Control",
            "Health Services > Dentist",
            "Health Services > Emergency Facility",
            "Health Services > Family Medicine",
            "Health Services > Fitness",
            "Health Services > Holistic Dentistry",
            "Health Services > Holistic Healthcare",
            "Health Services > Nutrition & Lifestyle Coach",
            "Health Services > Salon or Day Spa",
            "Home & Auto Insurance",
            "Interior Design",
            "Attorneys & Legal Services",
            "Attorneys & Legal Services > Corporate Law & LLCs",
            "Attorneys & Legal Services > Criminal Law",
            "Attorneys & Legal Services > Wills, Trusts & Estate Planning",
            "Attorneys & Legal Services > Juvenile Law",
            "Attorneys & Legal Services > Residential & Commercial Real Estate",
            "Meeting Venues",
            "Music Entertainment",
            "Music Lessons",
            "Organize Home, Business, Life",
            "Photography",
            "Private Education",
            "Real Estate",
            "Real Estate > Real Estate Agents & Brokers",
            "Real Estate > Real Estate Development",
            "Retail",
            "Retail > Apparel",
            "Retail > Cannabis Dispensary",
            "Retail > Florist",
            "Retail > Home Appliance",
            "Retail > Home Decor & Gifts",
            "Wedding Venues"
          ],
          "hint": "Pick one or more. A subcategory is also found under its main category."
        },
        {
          "label": "Specialty (optional)",
          "name": "specialty",
          "widget": "string",
          "required": false,
          "hint": "Shown under the name instead of the category names. For example: Management Consulting"
        },
        {
          "label": "Short description",
          "name": "description",
          "widget": "text",
          "required": false,
          "hint": "One or two sentences. Shown publicly."
        },
        {
          "label": "Logo",
          "name": "logo",
          "widget": "image",
          "required": false,
          "hint": "PNG or JPG, square if possible, at least 256 by 256 pixels, under 2 MB, white or transparent background."
        }
      ]
    }
  ]
}
